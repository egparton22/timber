name: Weekly EY link check

# Checks every link to EY's websites and EY's GitHub (EYBlockchain) in the repo's docs.
# Runs every Monday, and can be started by hand from the Actions tab.
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - '**/*.md'
      - '.github/workflows/ey-link-check.yml'

permissions:
  contents: read
  issues: write

jobs:
  check-ey-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check EY links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --root-dir '${{ github.workspace }}'
            --exclude-path node_modules
            --exclude '.*'
            --include 'github\.com/EYBlockchain'
            --include '(^|[./])ey\.com'
            './**/*.md'
          output: ./lychee-report.md
          fail: false

      - name: Open an issue if any EY link is broken (scheduled runs)
        if: steps.lychee.outputs.exit_code != 0 && github.event_name != 'pull_request'
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: Broken EY links found by the weekly link check
          content-filepath: ./lychee-report.md
          labels: broken-links

      - name: Fail if any EY link is broken
        if: steps.lychee.outputs.exit_code != 0
        run: |
          cat ./lychee-report.md
          exit 1
